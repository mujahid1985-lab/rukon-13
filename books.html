<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#103C4A">
<title>বইয়ের তালিকা</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="p-body wide">
<main class="p-wrap" id="app"></main>
<script type="module">
import { db, collection, getDocs, getDoc, doc, setDoc, query, where } from "./assets/firebase.js";
import { requireUser, touchUser, topHtml, setTop, groupCardHtml, groupBooks, topicMode, sylNote, BN_LETTERS, rollBadge, rollNum, bd, n2, markTrunc, loaderHtml, msgHtml, emptyHtml, qs, esc, toBn, T } from "./assets/app.js";

const app = document.getElementById('app');
const bar = `<div class="p-bar"><button type="button" class="p-fil" id="fA" aria-pressed="true"><span>${esc(T('bk_all'))}</span>${bd('', 'bAll')}</button><div class="p-filters"><button type="button" class="p-fil" id="fR" aria-pressed="false"><span>${esc(T('bk_read'))}</span>${bd('', 'bRead')}</button><button type="button" class="p-fil" id="fU" aria-pressed="false"><span>${esc(T('bk_unread'))}</span>${bd('', 'bUn')}</button></div></div>`;
document.body.insertAdjacentHTML('afterbegin', topHtml({ title: '', back: 'index.html', bar }));
app.innerHTML = loaderHtml(4);
const user = await requireUser();
const profile = (await touchUser(user)) || {};
const marks = Object.assign({}, profile.doneBooks || {});
const sid = qs('s');
let items = [], topics = [], filter = 'all', first = true, lastRead = null;
const $ = (id) => document.getElementById(id);
function counts(anim) {
  const all = items.concat(topics);
  const done = all.filter(b => marks[b.id]).length, rest = all.length - done;
  const dir = lastRead === null ? 1 : (done > lastRead ? 1 : -1);
  if (anim && lastRead !== null) { rollBadge($('bRead'), n2(done), dir); rollBadge($('bUn'), n2(rest), -dir); }
  else { rollNum($('bRead'), n2(done), 0); rollNum($('bUn'), n2(rest), 0); }
  rollNum($('bAll'), n2(all.length), 0); lastRead = done;
}
const letter = (k) => (BN_LETTERS[k % BN_LETTERS.length] || '') + (k >= BN_LETTERS.length ? Math.floor(k / BN_LETTERS.length) + 1 : '');
const topicHref = (t) => { const m = topicMode(t), id = encodeURIComponent(t.id); return m === 'page' ? 'book.html?b=' + id : m === 'doc' ? 'view.html?b=' + id + '&t=read' : (m === 'list' || m === 'parts') ? 'list.html?b=' + id : ''; };
function draw(anim) {
  const pass = (b) => filter === 'all' ? true : filter === 'read' ? marks[b.id] : !marks[b.id];
  $('fA').classList.toggle('on', filter === 'all'); $('fA').setAttribute('aria-pressed', filter === 'all');
  $('fR').classList.toggle('on', filter === 'read'); $('fU').classList.toggle('on', filter === 'unread');
  $('fR').setAttribute('aria-pressed', filter === 'read'); $('fU').setAttribute('aria-pressed', filter === 'unread');
  const num = {}; items.forEach((b, k) => { num[b.id] = k + 1; });
  const bshown = items.filter(pass), tshown = topics.filter(pass);
  const tHtml = groupBooks(topics).map((g, i) => { const rows = g.items.map((t, k) => ({ t, k })).filter(({ t }) => pass(t)).map(({ t, k }) => ({ label: t.name, href: topicHref(t), id: t.id, done: !!marks[t.id], n: letter(k), sy: sylNote(t) })); return rows.length ? groupCardHtml({ title: g.title, i, anim: first, tip: T('bk_tick'), rows }) : ''; }).join('');
  const bHtml = groupBooks(bshown).map((g, i) => groupCardHtml({ title: g.title, i: i + 2, anim: first, tip: T('bk_tick'), rows: g.items.map(b => ({ label: b.name, href: 'book.html?b=' + encodeURIComponent(b.id), id: b.id, done: !!marks[b.id], n: num[b.id], sy: sylNote(b) })) })).join('');
  $('lst').innerHTML = (tHtml + bHtml) || emptyHtml('', items.length + topics.length ? T('bk_empty_f') : T('bk_empty'));
  first = false; counts(anim);
  document.querySelectorAll('#lst .p-gr-row.plain').forEach(r => { const t = r.querySelector('.p-t'); r.classList.toggle('trunc', !!t && t.scrollWidth > t.clientWidth + 1); });
  markTrunc($('lst'));
}
try {
  if (!sid) throw new Error('no id');
  const sec = await getDoc(doc(db, 'section_buttons', sid));
  if (!sec.exists() || sec.data().hidden) throw new Error('missing');
  const sd = sec.data(), name = sd.name || 'বই';
  document.title = name; setTop(name, sd.sub, sylNote(sd));
  if (sd.homeId) $('pBack').href = 'section.html?h=' + encodeURIComponent(sd.homeId);
  const snap = await getDocs(query(collection(db, 'sub_buttons'), where('sectionId', '==', sid)));
  const all = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.v === 3 && !x.hidden).sort((a, b) => (a.order || 0) - (b.order || 0));
  items = all.filter(x => !x.kind); topics = all.filter(x => x.kind === 'topic');
  app.innerHTML = `<div class="p-stack" id="lst"></div>`;
  draw(false);
  $('fA').onclick = () => { filter = 'all'; draw(false); };
  $('fR').onclick = () => { filter = 'read'; draw(false); };
  $('fU').onclick = () => { filter = 'unread'; draw(false); };
  $('lst').addEventListener('click', async (e) => {
    const pl = e.target.closest('.p-gr-row.plain.trunc'); if (pl && !e.target.closest('.p-chk')) { location.href = 'full.html?b=' + encodeURIComponent(pl.dataset.id); return; }
    const c = e.target.closest('.p-chk'); if (!c) return;
    e.preventDefault(); e.stopPropagation();
    const id = c.dataset.chk, v = !marks[id]; marks[id] = v;
    if (filter === 'all') { c.classList.toggle('on', v); c.setAttribute('aria-pressed', v); c.closest('.p-gr-row').classList.toggle('is-done', v); counts(true); }
    else draw(true);
    try { await setDoc(doc(db, 'users', user.uid), { doneBooks: { [id]: v } }, { merge: true }); } catch (er) { console.error(er); marks[id] = !v; draw(true); }
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => markTrunc($('lst')));
  addEventListener('resize', () => markTrunc($('lst')));
} catch (err) { console.error(err); app.innerHTML = msgHtml(T('load_err'), true); }
</script>
</body>
</html>
