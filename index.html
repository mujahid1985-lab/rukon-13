<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#103C4A">
<title>রুকন প্রস্তুতি</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="p-body">
<main class="p-wrap" id="app"></main>
<script type="module">
import { db, collection, getDocs } from "./assets/firebase.js";
import { requireUser, touchUser, topHtml, setTop, homeBtnHtml, loaderHtml, msgHtml, emptyHtml, siteData, clampAll, T } from "./assets/app.js";

const app = document.getElementById('app');
document.body.insertAdjacentHTML('afterbegin', topHtml({ title: 'রুকন প্রস্তুতি', noBack: true }));
app.innerHTML = `<div class="p-stack btns">${loaderHtml(3)}</div>`;
const HK = 'p_home_v3';
const draw = (items) => { app.innerHTML = items.length
  ? `<div class="p-stack btns">${items.map((b, i) => homeBtnHtml({ label: b.name, href: 'section.html?h=' + encodeURIComponent(b.id), i })).join('')}</div>`
  : emptyHtml('', T('home_empty_t'), T('home_empty_s')); clampAll(app); };
let cached = null; try { cached = JSON.parse(sessionStorage.getItem(HK) || 'null'); } catch (e) {}
if (cached && cached.length) draw(cached);                       // instant paint, refreshed below
const homesP = getDocs(collection(db, 'home_buttons'));          // starts at once, in parallel with the login check
const user = await requireUser();
touchUser(user);
try {
  const snap = await homesP;
  // keep one button per name+kind even if the database has accidental duplicates
  const seen = new Set();
  const items = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.v === 3 && !x.hidden).sort((a, b) => (a.order || 0) - (b.order || 0))
    .filter(x => { const k = x.name + '|' + x.kind; if (seen.has(k)) return false; seen.add(k); return true; });
  try { sessionStorage.setItem(HK, JSON.stringify(items.map(x => ({ id: x.id, name: x.name })))); } catch (e) {}
  draw(items);
} catch (err) { console.error(err); if (!cached) app.innerHTML = msgHtml(T('load_err'), true); }
</script>
</body>
</html>
